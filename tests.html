<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테마백독 규칙 시험</title>
<style>
  body { margin: 0; padding: 16px; font-family: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; background: #F6F3EC; color: #1F2A2E; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  #summary { font-size: 16px; font-weight: 700; margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; }
  #summary.pass { background: #DCEBE9; color: #14504D; }
  #summary.fail { background: #FBE9D3; color: #7A3F06; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: 13px; }
  th, td { border-bottom: 1px solid #E6E1D5; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #EFEBE1; }
  td.r { font-weight: 700; white-space: nowrap; }
  tr.ok td.r { color: #1F6F6B; }
  tr.ng td.r { color: #B00020; }
  tr.ng { background: #FFF4F4; }
  tr.group td { background: #F6F3EC; font-weight: 700; }
  code { font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<h1>테마백독 규칙 시험 (rules.js)</h1>
<div id="summary">시험 중…</div>
<table>
  <thead><tr><th>시험</th><th>기대값</th><th>실제값</th><th>결과</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script type="module">
import * as R from './js/rules.js';

const S = { ...R.DEFAULT_SETTINGS };
const rows = document.getElementById('rows');
let pass = 0, fail = 0;

function group(name) {
  const tr = document.createElement('tr');
  tr.className = 'group';
  tr.innerHTML = `<td colspan="4"></td>`;
  tr.firstChild.textContent = name;
  rows.appendChild(tr);
}
function eq(name, actual, expected) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  const ok = a === e;
  ok ? pass++ : fail++;
  const tr = document.createElement('tr');
  tr.className = ok ? 'ok' : 'ng';
  for (const [txt, cls] of [[name], [e, 'c'], [a, 'c'], [ok ? '통과' : '실패', 'r']]) {
    const td = document.createElement('td');
    if (cls === 'c') { const c = document.createElement('code'); c.textContent = txt; td.appendChild(c); }
    else td.textContent = txt;
    if (cls === 'r') td.className = 'r';
    tr.appendChild(td);
  }
  rows.appendChild(tr);
}
function run(name, fn) {
  try { fn(); } catch (err) { eq(name + ' (예외)', String(err), '예외 없음'); }
}
// 날짜별 쪽수로 기록 배열 만들기: { '2026-11-20': 25, ... } / 값이 'T'면 30분 기록
function recs(map, bookId = 'b1') {
  return Object.entries(map).map(([date, v]) =>
    v === 'T' ? { date, bookId, endPage: 0, pages: 0, minutes: 30, mode: 'time' }
              : { date, bookId, endPage: 0, pages: v, minutes: null, mode: 'pages' });
}

run('등급', () => {
  group('등급 경계값');
  for (const [p, g] of [[0, 'none'], [9, 'none'], [10, 'accept'], [19, 'accept'], [20, 'min'], [49, 'min'], [50, 'goal'], [120, 'goal']]) {
    eq(`${p}쪽 → ${g}`, R.gradeOf({ pages: p }, S), g);
  }
  for (const [m, g] of [[29, 'none'], [30, 'min'], [59, 'min'], [60, 'goal']]) {
    eq(`${m}분 → ${g}`, R.gradeOf({ pages: 0, minutes: m }, S), g);
  }
  eq('기록 없음 → none', R.gradeOf(null, S), 'none');
  eq('30분 읽음 기록 → min', R.gradeOf(R.makeTimeRecord({ date: '2026-11-20', bookId: 'b1', records: [], settings: S }), S), 'min');
  eq('설정 변경(최소 30쪽): 29쪽 → accept', R.gradeOf({ pages: 29 }, { ...S, minPages: 30 }), 'accept');
});

run('연속일수', () => {
  group('연속일수');
  const T = '2026-11-20';
  eq('3일 연속(오늘 포함) → 3', R.streak(recs({ '2026-11-18': 20, '2026-11-19': 10, '2026-11-20': 50 }), S, T), 3);
  eq('오늘 미기록은 쉰 날이 아님 → 어제까지 2', R.streak(recs({ '2026-11-18': 20, '2026-11-19': 20 }), S, T), 2);
  eq('하루 쉼은 유지(18,19 읽음 / 20 쉼 / 21 읽음) → 3', R.streak(recs({ '2026-11-18': 20, '2026-11-19': 20, '2026-11-21': 20 }), S, '2026-11-21'), 3);
  eq('이틀 쉼이면 끊김(17,18 읽음 / 19,20 쉼 / 21 읽음) → 1', R.streak(recs({ '2026-11-17': 20, '2026-11-18': 20, '2026-11-21': 20 }), S, '2026-11-21'), 1);
  eq('어제 쉬고 오늘 미기록 → 그 전까지 2', R.streak(recs({ '2026-11-17': 20, '2026-11-18': 20 }), S, T), 2);
  eq('이틀 쉬고 오늘 미기록 → 0', R.streak(recs({ '2026-11-16': 20, '2026-11-17': 20 }), S, T), 0);
  eq('9쪽은 쉰 날로 침(18 읽음 / 19 9쪽 / 20 9쪽 / 21 읽음) → 1', R.streak(recs({ '2026-11-18': 20, '2026-11-19': 9, '2026-11-20': 9, '2026-11-21': 20 }), S, '2026-11-21'), 1);
  eq('오늘 9쪽(아직 하루 안 끝남)은 쉰 날로 안 침 → 어제까지 2', R.streak(recs({ '2026-11-18': 20, '2026-11-19': 20, '2026-11-20': 9 }), S, T), 2);
  eq('30분 기록도 연속에 포함', R.streak(recs({ '2026-11-19': 'T', '2026-11-20': 10 }), S, T), 2);
  eq('기록 없음 → 0', R.streak([], S, T), 0);
  eq('연말을 넘는 연속(12/30~1/2) → 4', R.streak(recs({ '2026-12-30': 20, '2026-12-31': 20, '2027-01-01': 20, '2027-01-02': 20 }), S, '2027-01-02'), 4);
  eq('누적 읽은 날은 끊겨도 줄지 않음 → 3', R.totalReadDays(recs({ '2026-11-10': 20, '2026-11-11': 10, '2026-11-20': 50, '2026-11-15': 5 }), S, '2026-11-01'), 3);
  eq('누적 읽은 날: 프로젝트 시작 전 기록 제외 → 1', R.totalReadDays(recs({ '2026-10-31': 20, '2026-11-02': 20 }), S, '2026-11-01'), 1);
});

run('쉰 다음 날 안내', () => {
  group('하루 쉰 다음 날 안내');
  const T = '2026-11-20';
  eq('어제 쉼 + 오늘 미기록 → oneDay', R.restNotice(recs({ '2026-11-18': 20 }), S, T, '2026-11-01')?.type, 'oneDay');
  eq('oneDay 문구', R.restNotice(recs({ '2026-11-18': 20 }), S, T, '2026-11-01')?.text, '어제 하루 쉬었어요. 오늘 10쪽이면 연속이 이어집니다.');
  eq('이틀 쉼 → restart 문구', R.restNotice(recs({ '2026-11-10': 20, '2026-11-17': 20 }), S, T, '2026-11-01')?.text, '다시 시작해요. 지금까지 읽은 날 2일.');
  eq('오늘 이미 기록 → 없음', R.restNotice(recs({ '2026-11-18': 20, '2026-11-20': 5 }), S, T, '2026-11-01'), null);
  eq('어제 읽음 → 없음', R.restNotice(recs({ '2026-11-19': 20 }), S, T, '2026-11-01'), null);
  eq('아직 읽은 날이 없음(첫날들) → 없음', R.restNotice([], S, T, '2026-11-15'), null);
});

run('주 경계', () => {
  group('주 경계 (일요일 → 월요일)');
  eq('일요일 11/22의 주 시작 → 월 11/16', R.weekStart('2026-11-22', 1), '2026-11-16');
  eq('월요일 11/23의 주 시작 → 11/23', R.weekStart('2026-11-23', 1), '2026-11-23');
  eq('금요일 11/20 남은 날(오늘 포함) → 3', R.daysLeftInWeek('2026-11-20', 1), 3);
  eq('일요일 남은 날 → 1', R.daysLeftInWeek('2026-11-22', 1), 1);
  eq('월요일 남은 날 → 7', R.daysLeftInWeek('2026-11-23', 1), 7);
  const books = [{ id: 'a', status: 'done', finishDate: '2026-11-22' }, { id: 'b', status: 'reading' }];
  eq('일요일에 완독한 책: 그 주 → 1권 완독', R.doneThisWeek(books, '2026-11-22', 1), 1);
  eq('다음 주 월요일에는 → 0권', R.doneThisWeek(books, '2026-11-23', 1), 0);
  eq('이번 주 몇 권째(일요일): 완독1 + 읽는 중1 → 2', R.weekBookOrdinal(books, '2026-11-22', 1), 2);
  eq('이번 주 몇 권째(월요일) → 1', R.weekBookOrdinal(books, '2026-11-23', 1), 1);
  eq('주간 7일(일요일 기준)', R.weekDays('2026-11-22', 1), ['2026-11-16', '2026-11-17', '2026-11-18', '2026-11-19', '2026-11-20', '2026-11-21', '2026-11-22']);
  eq('하루 필요량: 남은 153쪽, 금요일 → 51쪽', R.dailyNeed(153, '2026-11-20', 1).perDay, 51);
  eq('하루 필요량: 일요일엔 남은 쪽 전부 → 40', R.dailyNeed(40, '2026-11-22', 1).perDay, 40);
  eq('하루 필요량: 남은 0쪽 → 0', R.dailyNeed(0, '2026-11-20', 1).perDay, 0);
});

run('월말·연말', () => {
  group('월말·연말 날짜');
  eq('11/30 + 1일 → 12/01', R.addDays('2026-11-30', 1), '2026-12-01');
  eq('12/31 + 1일 → 다음 해 1/01', R.addDays('2026-12-31', 1), '2027-01-01');
  eq('1/01 − 1일 → 전년 12/31', R.addDays('2027-01-01', -1), '2026-12-31');
  eq('2027-02-28 + 1일 → 03/01 (평년)', R.addDays('2027-02-28', 1), '2027-03-01');
  eq('2028-02-28 + 1일 → 02/29 (윤년)', R.addDays('2028-02-28', 1), '2028-02-29');
  eq('2027-01-01(금)의 주 시작 → 2026-12-28(월)', R.weekStart('2027-01-01', 1), '2026-12-28');
  eq('연말을 걸친 주의 끝 → 2027-01-03', R.weekEnd('2026-12-31', 1), '2027-01-03');
  eq('12/28 ~ 1/03 날짜 차이 → 6', R.daysBetween('2026-12-28', '2027-01-03'), 6);
  eq('2026-02-29는 없는 날짜', R.isDateStr('2026-02-29'), false);
  eq('2028-02-29는 있는 날짜', R.isDateStr('2028-02-29'), true);
  eq('연말 주 완독 수(12/31 완독, 1/02 기준) → 1', R.doneThisWeek([{ status: 'done', finishDate: '2026-12-31' }], '2027-01-02', 1), 1);
});

run('쪽수', () => {
  group('endPage 범위 제한과 오늘 읽은 쪽수');
  eq('−5 → 0', R.clampEndPage(-5, 312), 0);
  eq('400 → 312(전체 쪽수)', R.clampEndPage(400, 312), 312);
  eq('312 → 312', R.clampEndPage(312, 312), 312);
  eq('"159" → 159', R.clampEndPage('159', 312), 159);
  eq('숫자 아님 → 0', R.clampEndPage('abc', 312), 0);
  eq('159.6 → 160(반올림)', R.clampEndPage(159.6, 312), 160);
  const rs = [
    { date: '2026-11-18', bookId: 'b1', endPage: 134, pages: 34, mode: 'pages' },
    { date: '2026-11-19', bookId: 'b2', endPage: 50, pages: 50, mode: 'pages' },
  ];
  eq('이전 기록 endPage(같은 책만) → 134', R.prevEndPage(rs, 'b1', '2026-11-20'), 134);
  eq('이전 기록 없음 → 0', R.prevEndPage(rs, 'b3', '2026-11-20'), 0);
  const r1 = R.makePagesRecord({ date: '2026-11-20', projectId: 'p', bookId: 'b1', endPage: 159, totalPages: 312, records: rs });
  eq('오늘 159쪽까지 → 오늘 25쪽', [r1.endPage, r1.pages], [159, 25]);
  const r2 = R.makePagesRecord({ date: '2026-11-20', projectId: 'p', bookId: 'b1', endPage: 999, totalPages: 312, records: rs });
  eq('범위 넘는 입력 → 312쪽까지, 178쪽', [r2.endPage, r2.pages], [312, 178]);
  const r3 = R.makePagesRecord({ date: '2026-11-20', projectId: 'p', bookId: 'b1', endPage: 100, totalPages: 312, records: rs });
  eq('어제보다 앞 쪽 입력 → 0쪽(음수 아님)', r3.pages, 0);
  const t = R.makeTimeRecord({ date: '2026-11-20', projectId: 'p', bookId: 'b1', records: rs, settings: S });
  eq('30분 기록: endPage 그대로, pages 0, minutes 30', [t.mode, t.endPage, t.pages, t.minutes], ['time', 134, 0, 30]);
  const all = [
    { date: '2026-11-18', bookId: 'b1', endPage: 150, pages: 34, mode: 'pages' },
    { date: '2026-11-19', bookId: 'b1', endPage: 134, pages: 0, mode: 'time' },
    { date: '2026-11-20', bookId: 'b1', endPage: 170, pages: 36, mode: 'pages' },
  ];
  eq('지난 날 수정 후 다시 계산', R.recomputeBook(all, 'b1').map((r) => [r.date, r.endPage, r.pages]),
    [['2026-11-18', 150, 150], ['2026-11-19', 150, 0], ['2026-11-20', 170, 20]]);
  eq('현재 쪽(마지막 기록) → 170', R.latestEndPage(all, 'b1'), 170);
});

run('오늘 상태 문구', () => {
  group('오늘 상태 문구');
  eq('25쪽', R.todayStatus({ pages: 25 }, S).text, '최소선 달성 · 목표선까지 25쪽');
  eq('12쪽', R.todayStatus({ pages: 12 }, S).text, '인정선(10쪽) 달성 · 최소선까지 8쪽');
  eq('3쪽', R.todayStatus({ pages: 3 }, S).text, '최소선까지 17쪽');
  eq('50쪽', R.todayStatus({ pages: 50 }, S).text, '목표선 달성 · 50쪽 이상');
  eq('30분', R.todayStatus({ pages: 0, timeOnly: true }, S).text, '30분 읽음으로 기록 · 최소선 달성');
});

run('완독 예상·백업', () => {
  group('완독 예상일과 백업 알림');
  const book = { id: 'b1', totalPages: 312, currentPage: 160, startDate: '2026-11-16' };
  const rs = recs({ '2026-11-16': 35, '2026-11-17': 20, '2026-11-18': 50, '2026-11-20': 25 });
  const est = R.finishEstimate(rs, book, '2026-11-20');
  eq('평균 26쪽(5일), 남은 152쪽 → 11/26', [est.avg, est.date], [26, '2026-11-26']);
  eq('책 시작 이후로 한정: 오늘 시작해 30쪽 → 평균 30', R.finishEstimate(recs({ '2026-11-20': 30, '2026-11-10': 100 }), { ...book, startDate: '2026-11-20' }, '2026-11-20').avg, 30);
  eq('최근 7일만 사용(8일 전 기록 제외)', R.finishEstimate(recs({ '2026-11-12': 100, '2026-11-20': 14 }), { ...book, startDate: '2026-11-01' }, '2026-11-20').avg, 2);
  eq('평균 0 → 표시 안 함(null)', R.finishEstimate([], book, '2026-11-20'), null);
  eq('백업한 적 없음 → 알림', R.backupReminder(null, '2026-11-20'), { days: null });
  eq('6일 전 백업 → 알림 없음', R.backupReminder('2026-11-14', '2026-11-20'), null);
  eq('7일 전 백업 → 7일 알림', R.backupReminder('2026-11-13', '2026-11-20'), { days: 7 });
});

run('주간 집계', () => {
  group('주간 집계 (시안 예시: 월35 화20 수50 목0 금25)');
  const rs = recs({ '2026-11-16': 35, '2026-11-17': 20, '2026-11-18': 50, '2026-11-20': 25 });
  const w = R.weekStats(rs, S, '2026-11-20', '2026-11-01');
  eq('기간', [w.start, w.end], ['2026-11-16', '2026-11-22']);
  eq('읽은 쪽수 130', w.pages, 130);
  eq('최소선 4/5일', [w.minDays, w.countedDays], [4, 5]);
  eq('목표선 1일', w.goalDays, 1);
  eq('쉰 날: 목요일', w.restDays, ['2026-11-19']);
  const w2 = R.weekStats(recs({ '2026-11-16': 35 }), S, '2026-11-17', '2026-11-01');
  eq('오늘 미기록은 세지 않음 → 1/1일', [w2.minDays, w2.countedDays, w2.restDays.length], [1, 1, 0]);
  const w3 = R.weekStats(recs({ '2026-11-20': 20 }), S, '2026-11-20', '2026-11-19');
  eq('프로젝트 시작 전 날은 세지 않음 → 쉰 날 1(목)', w3.restDays, ['2026-11-19']);
  const cells = R.calendarCells(rs, S, '2026-11-20', '2026-10-28');
  eq('최근 4주 달력 28칸, 첫 칸 10/26(월)', [cells.length, cells[0].date], [28, '2026-10-26']);
  eq('달력: 10/26·10/27은 시작 전, 목은 쉰 날, 토는 앞날', [cells[0].kind, cells[2].kind, cells[24].kind, cells[26].kind], ['before', 'rest', 'rest', 'future']);
});

run('달성률·백업 파일', () => {
  group('서브카테고리 합계와 백업 파일 확인');
  const subs = [{ id: 'c1', name: 'A', targetBooks: 60, order: 0 }, { id: 'c2', name: 'B', targetBooks: 40, order: 1 }];
  const books = [{ id: 'x', status: 'done', subcategoryId: 'c2' }, { id: 'y', status: 'reading', subcategoryId: 'c1' }];
  const cp = R.categoryProgress(subs, books, 100);
  eq('합계 100 = 목표 100 일치, B 완독 1', [cp.goalSum, cp.matches, cp.rows[1].done, cp.done], [100, true, 1, 1]);
  eq('합계 불일치', R.categoryProgress(subs, books, 90).matches, false);
  const good = {
    app: 'themebaekdok', schemaVersion: 1, exportedAt: '2026-11-20T00:00:00Z',
    data: { projects: [{ id: 'p' }], subcategories: [], books: [{ id: 'b', status: 'reading' }],
      dayRecords: [{ date: '2026-11-20', bookId: 'b' }], settings: {} },
  };
  eq('올바른 파일 → 통과', R.validateBackup(good).ok, true);
  eq('다른 앱 파일 → 거부', R.validateBackup({ ...good, app: 'x' }).ok, false);
  eq('새 버전 파일 → 거부', R.validateBackup({ ...good, schemaVersion: 2 }).ok, false);
  eq('같은 날짜 두 번 → 거부', R.validateBackup({ ...good, data: { ...good.data, dayRecords: [{ date: '2026-11-20', bookId: 'b' }, { date: '2026-11-20', bookId: 'b' }] } }).ok, false);
  eq('없는 책을 가리키는 기록 → 거부', R.validateBackup({ ...good, data: { ...good.data, dayRecords: [{ date: '2026-11-20', bookId: 'zz' }] } }).ok, false);
  eq('JSON이 아닌 값 → 거부', R.validateBackup(null).ok, false);
});

run('v1.1 A 백업 시각', () => {
  group('v1.1 A. 가져온 뒤 마지막 백업 시각');
  const file = {
    app: 'themebaekdok', schemaVersion: 1, exportedAt: '2026-11-10T09:00:00.000Z',
    data: { projects: [{ id: 'p' }], subcategories: [], books: [{ id: 'b', status: 'reading' }],
      dayRecords: [{ date: '2026-11-09', bookId: 'b' }], settings: { id: 'settings', minPages: 25, lastBackupAt: null } },
  };
  const n = R.normalizeBackup(file, '2026-11-20T00:00:00.000Z');
  eq('lastBackupAt = 파일의 exportedAt', n.settings.lastBackupAt, '2026-11-10T09:00:00.000Z');
  eq('설정 값은 유지(최소선 25), id 칸은 빠짐', [n.settings.minPages, 'id' in n.settings], [25, false]);

  eq('통계 복사 문구의 예상 완료일에 연도', /^백독 예상 완료: \d{4}년 \d{1,2}월 \d{1,2}일$/.test(line), true);
});

run('v1.4 1단계', () => {
  group('v1.4 2장. 같은 날 여러 책 → 그날 합계로 판단');
  const two = [
    { id: '2026-11-20|a', date: '2026-11-20', bookId: 'a', projectId: 'p', pages: 15, mode: 'pages' },
    { id: '2026-11-20|x', date: '2026-11-20', bookId: 'x', projectId: null, pages: 10, mode: 'pages' },
    { id: '2026-11-19|a', date: '2026-11-19', bookId: 'a', projectId: 'p', pages: 9, mode: 'pages' },
    { id: '2026-11-19|x', date: '2026-11-19', bookId: 'x', projectId: null, pages: 0, minutes: 30, mode: 'time' },
  ];
  const day = R.recordMap(two).get('2026-11-20');
  eq('백독 15쪽 + 백독 외 10쪽 = 25쪽, 최소선', [day.pages, R.gradeOf(day, S), day.records.length], [25, 'min', 2]);
  eq('9쪽 + 30분 = 최소선(분 합계)', R.gradeOf(R.recordMap(two).get('2026-11-19'), S), 'min');
  eq('연속일수: 이틀(같은 날 두 건은 하루로)', R.streak(two, S, '2026-11-20'), 2);
  eq('누적 읽은 날: 2일', R.totalReadDays(two, S, null), 2);
  const w = R.weekStats(two, S, '2026-11-20', '2026-11-19');
  eq('주간 쪽수 34쪽, 최소선 2/2일', [w.pages, w.minDays, w.countedDays], [34, 2, 2]);
  eq('읽은 날 하루 평균은 날짜별 합계로(34쪽/2일=17)', R.cycleStats({ project: { id: 'p', startDate: '2026-11-19', targetBooks: 100 }, subcategories: [], books: [], records: two, settings: S, today: '2026-11-20' }).speed.pagesPerReadDay, 17);
  eq('기록 열쇠 = 날짜|책', R.recordKey('2026-11-20', 'a'), '2026-11-20|a');

  group('v1.4 A2. 이미 읽은 쪽수(readBefore)는 출발점일 뿐');
  eq('첫 기록의 "어제까지" = 이미 읽은 쪽수 120', R.prevEndPage([], 'm', '2026-11-20', 120), 120);
  const r1 = R.makePagesRecord({ date: '2026-11-20', projectId: null, bookId: 'm', endPage: 120, totalPages: 300, records: [], base: 120 });
  eq('추가한 날 120쪽 그대로면 오늘 0쪽', [r1.endPage, r1.pages, r1.id], [120, 0, '2026-11-20|m']);
  const r2 = R.makePagesRecord({ date: '2026-11-21', projectId: null, bookId: 'm', endPage: 140, totalPages: 300, records: [r1], base: 120 });
  eq('다음 기록 +20 → 140쪽, 오늘 20쪽', [r2.endPage, r2.pages], [140, 20]);
  eq('첫 기록부터 +20 → 140쪽, 20쪽(120쪽을 더하지 않음)', R.makePagesRecord({ date: '2026-11-20', bookId: 'm', endPage: 140, totalPages: 300, records: [], base: 120 }).pages, 20);
  eq('다시 계산할 때도 출발점 120', R.recomputeBook([{ ...r2, pages: 999 }], 'm', 120).map((r) => r.pages), [20]);
  eq('기록 없을 때 현재 쪽 = 120', R.latestEndPage([], 'm', 120), 120);
  eq('30분 기록은 현재 쪽 그대로(120)', R.makeTimeRecord({ date: '2026-11-20', bookId: 'm', records: [], settings: S, base: 120 }).endPage, 120);

  group('v1.4 마이그레이션(백업 파일 v1~v5)');
  const oldBooks = [{ id: 'b1', projectId: 'p1', status: 'done', subcategoryId: 'c' }, { id: 'b2', projectId: 'p2', status: 'reading', subcategoryId: 'c2' }];
  const oldRecs = [{ date: '2026-11-19', bookId: 'b1', projectId: 'p1', pages: 20, endPage: 20, mode: 'pages' }, { date: '2026-11-20', bookId: 'b2', projectId: 'p2', pages: 30, endPage: 30, mode: 'pages' }];
  const v4 = { app: 'themebaekdok', schemaVersion: 4, exportedAt: '2026-11-20T00:00:00Z', data: {
    projects: [{ id: 'p1', status: '완료', startDate: '2026-01-01', endDate: '2026-11-19', targetBooks: 1 }, { id: 'p2', status: '진행', startDate: '2026-11-20', targetBooks: 100 }],
    subcategories: [], books: oldBooks, dayRecords: oldRecs, recommendations: [], settings: {} } };
  eq('버전 4 파일 → 통과', R.validateBackup(v4).ok, true);
  const n4 = R.normalizeBackup(v4, 'x');
  eq('모든 책 백독 소속, 이미 읽은 쪽수 0', n4.books.map((b) => [b.scope, b.readBefore]), [['project', 0], ['project', 0]]);
  eq('기록 그대로 + 열쇠(날짜|책)', n4.dayRecords.map((r) => [r.id, r.pages, r.endPage, r.projectId]), [['2026-11-19|b1', 20, 20, 'p1'], ['2026-11-20|b2', 30, 30, 'p2']]);
  eq('마친 백독: 완독 1 ≥ 목표 1 → 완료', n4.projects.map((p) => p.endType || null), ['완료', null]);
  const v4b = { ...v4, data: { ...v4.data, projects: [{ ...v4.data.projects[0], targetBooks: 100 }, v4.data.projects[1]] } };
  eq('마친 백독: 완독 1 < 목표 100 → 중단', R.normalizeBackup(v4b, 'x').projects[0].endType, '중단');
  const v5 = { ...v4, schemaVersion: 5, data: { ...v4.data, dayRecords: [
    { id: '2026-11-20|b2', date: '2026-11-20', bookId: 'b2', pages: 15 }, { id: '2026-11-20|b1', date: '2026-11-20', bookId: 'b1', pages: 10 }] } };
  eq('버전 5: 같은 날 두 책 기록 → 통과', R.validateBackup(v5).ok, true);
  eq('버전 5: 같은 날 같은 책 두 번 → 거부', R.validateBackup({ ...v5, data: { ...v5.data, dayRecords: [v5.data.dayRecords[0], v5.data.dayRecords[0]] } }).ok, false);
  eq('버전 4 이하: 같은 날 두 건은 예전처럼 거부', R.validateBackup({ ...v4, data: { ...v4.data, dayRecords: [oldRecs[1], { ...oldRecs[1], bookId: 'b1' }] } }).ok, false);
  eq('버전 6(더 새 앱) → 거부', R.validateBackup({ ...v5, schemaVersion: 6 }).ok, false);
  eq('지금 저장 형식 = 5', R.SCHEMA_VERSION, 5);
  eq('이미 정리된 책은 그대로(같은 객체)', (() => { const b = { id: 'z', scope: 'outside', readBefore: 5, projectId: null }; return R.migrateBooks([b])[0] === b; })(), true);
});

run('v1.4 2단계', () => {
  group('v1.4 A1. 소속 바꾸기');
  const P = { id: 'p2', status: '진행', startDate: '2026-11-01' };
  const recs = [
    { id: '2026-10-30|o', date: '2026-10-30', bookId: 'o', projectId: null, pages: 10 },
    { id: '2026-11-02|o', date: '2026-11-02', bookId: 'o', projectId: null, pages: 20 },
    { id: '2026-11-02|z', date: '2026-11-02', bookId: 'z', projectId: 'p2', pages: 5 },
  ];
  const out = { id: 'o', scope: 'outside', projectId: null, subcategoryId: null, prevSubcategoryId: 'c9', status: 'reading' };
  let err = '';
  try { R.planScopeChange({ book: out, toScope: 'project', project: P, records: recs }); } catch (e) { err = e.message; }
  eq('백독 외 → 포함: 카테고리 필수', err, '카테고리를 골라 주세요.');
  const toP = R.planScopeChange({ book: out, toScope: 'project', project: P, subcategoryId: 'c1', records: recs });
  eq('포함으로: scope project, 진행 중 백독·카테고리 붙음', [toP.book.scope, toP.book.projectId, toP.book.subcategoryId], ['project', 'p2', 'c1']);
  eq('그 책의 기록 소속도 옮김(다른 책 기록은 그대로)', toP.records.map((r) => [r.id, r.projectId]), [['2026-10-30|o', 'p2'], ['2026-11-02|o', 'p2']]);
  const inB = { id: 'z', scope: 'project', projectId: 'p2', subcategoryId: 'c1', status: 'done' };
  const toO = R.planScopeChange({ book: inB, toScope: 'outside', project: P, records: recs });
  eq('포함 → 백독 외: 카테고리 비우고 이전 값 보관(완독 후에도 가능)', [toO.book.scope, toO.book.projectId, toO.book.subcategoryId, toO.book.prevSubcategoryId, toO.book.status], ['outside', null, null, 'c1', 'done']);
  eq('백독 외로: 기록 소속 null', toO.records.map((r) => [r.id, r.projectId]), [['2026-11-02|z', null]]);
  err = '';
  try { R.planScopeChange({ book: { ...inB, projectId: 'p1' }, toScope: 'outside', project: P, records: recs }); } catch (e) { err = e.message; }
  eq('마친 테마백독의 책은 소속 변경 불가', err, '마친 테마백독의 책은 소속을 바꿀 수 없어요.');
  err = '';
  try { R.planScopeChange({ book: out, toScope: 'project', project: null, subcategoryId: 'c1', records: recs }); } catch (e) { err = e.message; }
  eq('진행 중 백독이 없으면 포함으로 못 바꿈', err.startsWith('진행 중인 테마백독이 없어요'), true);
  eq('같은 소속이면 바뀌는 것 없음', R.planScopeChange({ book: out, toScope: 'outside', project: P, records: recs }).records, []);

  group('v1.4 A3·B-M5. 집계 구분');
  eq('주간 쪽수 목표 = 목표선×7, 최소 = 최소선×7', R.weekPageGoal(S), { goal: 350, min: 140 });
  eq('설정을 바꾸면 따라감(목표 40·최소 15)', R.weekPageGoal({ ...S, goalPages: 40, minPages: 15 }), { goal: 280, min: 105 });
  const books = [
    { id: 'a', status: 'done', scope: 'project', projectId: 'p1', subcategoryId: 'c1', finishDate: '2026-11-18' },
    { id: 'b', status: 'done', scope: 'outside', projectId: null, finishDate: '2026-11-19' },
    { id: 'c', status: 'reading', scope: 'outside', projectId: null },
  ];
  const cp = R.categoryProgress([{ id: 'c1', name: '가', targetBooks: 10, order: 0 }], books.filter((b) => b.scope !== 'outside'), 10);
  eq('달성률·카테고리 막대는 백독 책만(백독 외 완독 제외)', [cp.done, cp.rows[0].done], [1, 1]);
  eq('주간 완독: 백독 1 / 백독 외 1 따로', [R.doneThisWeek(books.filter((b) => b.scope !== 'outside'), '2026-11-20'), R.doneThisWeek(books.filter((b) => b.scope === 'outside'), '2026-11-20')], [1, 1]);
  const tot = R.historyTotals({ projects: [{ id: 'p1', status: '완료', endType: '중단' }, { id: 'p2', status: '진행' }], books, records: [], settings: S });
  eq('히스토리 합계: 백독 1 · 백독 외 1, 완료 0 · 중단 1 · 진행 1', [tot.doneProject, tot.doneOutside, tot.completed, tot.stopped, tot.active], [1, 1, 0, 1, 1]);
});

run('v1.4 3단계', () => {
  group('v1.4 B-H3. 마치기 완료/중단·메모');
  const p = { id: 'p1', status: '진행', startDate: '2026-01-01', targetBooks: 100 };
  const books = [{ id: 'r', projectId: 'p1', status: 'reading', totalPages: 100 }, { id: 'o', projectId: null, scope: 'outside', status: 'reading' }];
  const a = R.planFinishProject({ project: p, books, today: '2026-11-20', readingAction: 'carry', endType: '중단', endNote: '  다시 시작 ' });
  eq('중단으로 마치기: endType 중단, 메모 다듬어 저장', [a.project.endType, a.project.endNote, a.project.status], ['중단', '다시 시작', '완료']);
  eq('백독 외 읽는 중 책은 건드리지 않음', a.books.map((b) => b.id), ['r']);
  const b = R.planFinishProject({ project: p, books, today: '2026-11-20', readingAction: 'drop', endType: '완료', endNote: '무시됨' });
  eq('완료로 마치기: 메모 없음', [b.project.endType, b.project.endNote], ['완료', '']);
  const re = R.planReopenProject({ projects: [a.project], books: [], projectId: 'p1' });
  eq('되돌리기: endType·메모 지움', [re.project.status, re.project.endType, re.project.endNote], ['진행', null, '']);
});

const sum = document.getElementById('summary');
function showSummary() {
  sum.textContent = fail === 0 ? `모두 통과 (${pass}개)` : `실패 ${fail}개 / 전체 ${pass + fail}개`;
  sum.className = fail === 0 ? 'pass' : 'fail';
  document.title = sum.textContent;
}
showSummary();

// v1.3 B-2: 앱 버전(js/version.js)과 서비스 워커 VERSION이 같은지(파일을 읽어 와야 해서 마지막에)
(async () => {
  group('v1.3 B-2. 앱 버전 표시 = 서비스 워커 버전');
  try {
    const { APP_VERSION } = await import('./js/version.js');
    const swText = await (await fetch('sw.js', { cache: 'no-store' })).text();
    const m = /const VERSION = '([^']+)'/.exec(swText);
    eq('version.js와 sw.js의 버전이 같음', m && m[1], APP_VERSION);
    eq('버전 형식 v숫자.숫자', /^v\d+\.\d+/.test(APP_VERSION), true);
  } catch (err) {
    eq('버전 파일 읽기(예외)', String(err), '예외 없음');
  }
  showSummary();
})();
</script>
